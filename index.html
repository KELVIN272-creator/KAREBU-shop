<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KAREBU Shop</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>KAREBU Shop</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>

        <section class="hero">
            <h2>Welcome to KAREBU Shop</h2>

            <p>
                Find anything you want in one place.
            </p>

            <button>Shop Now</button>
        </section>

        <section class="products">

            <h2>Our Products</h2>

            <div class="product-list">

                <div class="product">
                    <div class="product-image">Product Image</div>

                    <h3>Product One</h3>

                    <p>1,000000FRW</p>

                    <button>Add to Cart</button>
                </div>

                <div class="product">
                    <div class="product-image">Product Image</div>

                    <h3>Product Two</h3>

                    <p>$30</p>

                    <button>Add to Cart</button>
                </div>

                <div class="product">
                    <div class="product-image">Product Image</div>

                    <h3>Product Three</h3>

                    <p>10000 FRW</p>

                    <button>Add to Cart</button>
                </div>

            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 KAREBU Shop. All rights reserved.</p>
    </footer>

</body>
</html>
